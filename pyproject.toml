[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-account-router"
version = "0.1.0"
description = "Repository-aware GitHub account routing for local coding assistants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
gh-router = "github_account_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
